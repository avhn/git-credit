# Purpose: Report known security advisories in the locked dependency graph.
# Triggers: Weekly schedule on Monday 06:00 UTC and manual invocation.
# Production effect: None.
# Gates: Independent, non-gating.
# External dependencies: GitHub-hosted ubuntu-latest runner; RustSec advisory database.
# Failure owner: avhn, GitHub Actions run status and logs.
# Budgets: initial estimate set 2026-11-08 before any measured run.
name: Dependency audit
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit production dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

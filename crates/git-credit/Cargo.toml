[package]
name = "git-credit"
description = "Fair git authorship stats: ownership and labor per author that formatting and trivial edits cannot steal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["git", "blame", "contributors", "cli", "badges"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap.workspace = true
credit-core.workspace = true
credit-git.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
globset = "0.4"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

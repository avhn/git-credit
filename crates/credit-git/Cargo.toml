[package]
name = "credit-git"
description = "Repository access for git-credit: history walking, renames, mailmap and co-author trailers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["git", "blame", "authorship", "history"]
categories = ["development-tools"]

[dependencies]
credit-core.workspace = true
gix = { version = "0.90", default-features = false, features = ["sha1", "revision", "mailmap", "blob-diff"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tempfile = "3.27.0"


[lints]
workspace = true

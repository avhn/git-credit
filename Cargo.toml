[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/avhn/git-credit"
homepage = "https://github.com/avhn/git-credit"
authors = ["Mert Dede <doganmertdede@gmail.com>"]

[workspace.dependencies]
credit-core = { path = "crates/credit-core", version = "0.1.0" }
credit-git = { path = "crates/credit-git", version = "0.1.0" }
clap = { version = "4.6", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
